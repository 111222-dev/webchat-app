<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Chat | Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    darkMode: 'class',
  }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .message-container { height: calc(100vh - 144px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .chat-bg {
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden" onclick="closeAllMenus()">

<div id="authOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
  <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md transform transition-all">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-bolt text-white text-3xl"></i>
      </div>
      <h2 id="authTitle" class="text-3xl font-bold text-slate-800 tracking-tight">Welcome Back</h2>
    </div>
    <form id="authForm" class="space-y-5">
      <div id="displayNameField" class="hidden">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Display Name</label>
        <input type="text" id="authName" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address</label>
        <input type="email" id="authEmail" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="authPassword" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <button type="submit" id="authSubmitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-xl font-bold text-lg shadow-md hover:shadow-lg transition-all">Login</button>
    </form>
    <div class="mt-8 text-center">
      <button id="toggleAuthMode" class="text-indigo-600 text-sm font-semibold hover:text-purple-600">Don't have an account? Create one</button>
    </div>
  </div>
</div>

<div id="forwardModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60] hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden" onclick="event.stopPropagation()">

      <h3 class="font-bold text-slate-800">Forward Message</h3>
      <button onclick="closeForwardModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="forwardRoomsList" class="p-2 max-h-64 overflow-y-auto"></div>
  </div>
</div>

<div id="createRoomModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60] hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden p-8" onclick="event.stopPropagation()">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-xl text-slate-800">Create New Channel</h3>
      <button onclick="closeCreateRoomModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <form id="createRoomForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Channel Name</label>
        <input type="text" id="newRoomName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. project-apollo">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, deleteDoc, updateDoc, getDocs, where, getDoc, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyDmQiNQx2oTSydrFLgGhORXsxBjRAnghr4",
    authDomain: "chatting-f6656.firebaseapp.com",
    projectId: "chatting-f6656"
  });
  
  const dbRTDB = getDatabase(app);

// App Settings State
let appSettings = JSON.parse(localStorage.getItem('nexusSettings')) || {
  theme: 'light',
  requireShiftEnter: false,
  muted: false
};

if (appSettings.theme === 'dark') {
  document.documentElement.classList.add('dark');
  document.getElementById('themeToggle').checked = true;
}
document.getElementById('sendModeToggle').checked = appSettings.requireShiftEnter;
document.getElementById('muteToggle').checked = appSettings.muted;

window.closeModals = () => {
  document.getElementById('profileModal').classList.add('hidden');
  document.getElementById('publicProfileModal').classList.add('hidden');
  document.getElementById('settingsModal').classList.add('hidden');
};

  const db = getFirestore(app);
  const auth = getAuth(app);

  let isSignUpMode = false;
  let currentRoomId = "general";
  let messageSub = null;
  let availableRooms = [];
  
  // App & Read/Unread State Tracking
  const locallyHiddenMessages = new Set();
  window.loadedMessages = {}; 
  let actionState = { type: null, docId: null }; 
  let pendingInvites = new Set();

  let userLastRead = {};           // Local map of {roomId: timestamp_ms}
  let unreadListeners = {};        // Firestore listeners per room
  let unreadCounts = {};           // Local map of {roomId: count}
  let currentRoomEntryTime = 0;    // Time user opened current room
  let firstUnreadFound = false;    // Tracks if separator was injected

  // --- UI TOGGLES (Auth) ---
  const toggleBtn = document.getElementById('toggleAuthMode');
  toggleBtn.onclick = () => {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').textContent = isSignUpMode ? "Create Account" : "Welcome Back";

  onAuthStateChanged(auth, async u => {

    document.getElementById('app').classList.add('hidden');
    
    // Cleanup listeners on logout
    for(const key in unreadListeners) { unreadListeners[key](); }
    unreadListeners = {}; unreadCounts = {};
  }
});

  document.getElementById('createRoomForm').onsubmit = async (e) => {

    btn.disabled = true;

    try {
      const name = document.getElementById('newRoomName').value.trim();
      const type = document.getElementById('newRoomType').value;
      let members = [];

      if (type === 'private') {
        const leftoverEmail = document.getElementById('inviteEmailInput').value.trim().toLowerCase();
        if (leftoverEmail && leftoverEmail !== auth.currentUser.email) pendingInvites.add(leftoverEmail);

          alert("You must invite at least one person to create a private channel.");

        for (let email of pendingInvites) {
          const q = query(collection(db, "users"), where("email", "==", email));

          else return alert(`Could not find user: ${email}. They must create an account first.`);

  // --- ROOMS & UNREAD TRACKING ---
  function loadRooms() {
    onSnapshot(collection(db, "rooms"), snap => {
      const container = document.getElementById('roomsList');
      container.innerHTML = '';
      availableRooms = [];
      
      availableRooms.push({id: 'general', name: 'General Chat'});
      renderRoomTab('general', 'General Chat', 'public', null);

      snap.forEach(room => {
        const data = room.data();
        if (room.id === 'general') return;
        
        if (data.type === 'public' || (data.members && data.members.includes(auth.currentUser.uid))) {
          availableRooms.push({id: room.id, name: data.name || room.id});
          renderRoomTab(room.id, data.name || room.id, data.type || 'public', data.createdBy);
        }
      });
      
      const activeTab = document.getElementById(`tab-${currentRoomId}`);
      if(activeTab) {
        activeTab.classList.remove('text-slate-100', 'text-slate-400', 'bg-slate-800', 'hover:bg-[#1f2937]');
        activeTab.classList.add('bg-indigo-600/20', 'text-indigo-400', 'font-bold');
      }
    });
  }

  function renderRoomTab(id, name, type, createdBy) {
    if(document.getElementById(`tab-${id}`)) return;
    const div = document.createElement('div');
    div.id = `tab-${id}`;
    
    const icon = type === 'private' ? 'fa-lock text-[11px]' : 'fa-hashtag';
    
    div.className = `flex items-center px-3 py-2.5 rounded-xl cursor-pointer transition-all duration-200 mb-1 group font-medium text-sm hover:bg-[#1f2937] text-slate-400 hover:text-slate-200`;
    div.innerHTML = `
      <i class="fa-solid ${icon} opacity-70 group-hover:text-slate-200 w-4 text-center mr-3"></i> 
      <span class="truncate flex-1 room-name text-left">${name}</span>
    `;
    
    div.onclick = () => switchRoom(id, name, type, createdBy);
    document.getElementById('roomsList').appendChild(div);

    // Initialize Unread Tracking Listener for this Room
    setupUnreadListener(id);
  }

  function setupUnreadListener(roomId) {
    if (unreadListeners[roomId]) return;

    // Listen to the last 100 messages to count unread messages without processing the entire history
    const q = query(collection(db, "rooms", roomId, "messages"), orderBy("time", "desc"), limit(100));
    unreadListeners[roomId] = onSnapshot(q, snap => {
      let count = 0;
      const lr = userLastRead[roomId] || 0;

      snap.forEach(docSnap => {
        const m = docSnap.data();
        const t = m.time ? m.time.toMillis() : Date.now();
        // Increment if message is newer than the user's last read time and wasn't sent by the user
        if (t > lr && m.uid !== auth.currentUser.uid) count++;
      });

      unreadCounts[roomId] = count;
      updateRoomTabBadge(roomId);
      updateTotalUnread();
    });
  }

  function updateRoomTabBadge(roomId) {
    const tab = document.getElementById(`tab-${roomId}`);
    if (!tab) return;
    if (roomId === currentRoomId) return; // Active room styling overrides this logic

    const count = unreadCounts[roomId] || 0;
    let badge = document.getElementById(`badge-${roomId}`);

    if (count > 0) {
      // Create or update the red number badge, but DO NOT highlight the chat text/background
      if (!badge) {
        badge = document.createElement('span');
        badge.id = `badge-${roomId}`;
        badge.className = 'ml-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm';
        tab.appendChild(badge);
      }
      badge.textContent = count > 99 ? '99+' : count;
    } else {
      // Remove the badge when read, leaving the normal tab styling intact
      if (badge) badge.remove();
    }
  }

  function updateTotalUnread() {
    let total = 0;
    for (const id in unreadCounts) {
      if (id !== currentRoomId) total += unreadCounts[id];
    }
    document.title = total > 0 ? `(${total > 99 ? '99+' : total}) Nexus Chat | Premium` : 'Nexus Chat | Premium';
  }

  function switchRoom(roomId, roomName, type, createdBy) {
    currentRoomId = roomId;
    document.getElementById('currentRoomName').textContent = roomName;
    document.getElementById('roomTypeIcon').className = `fa-solid ${type === 'private' ? 'fa-lock' : 'fa-hashtag'} text-slate-400 text-lg`;
    
    const deleteBtn = document.getElementById('deleteRoomBtn');
    (roomId !== 'general' && createdBy === auth.currentUser.uid) ? deleteBtn.classList.remove('hidden') : deleteBtn.classList.add('hidden');
    window.cancelAction(); 

    // --- NEW READ RECEIPTS LOGIC ---
    currentRoomEntryTime = userLastRead[roomId] || 0;
    firstUnreadFound = false;

    // Immediately update read status locally & in database
    userLastRead[roomId] = Date.now();
    setDoc(doc(db, "users", auth.currentUser.uid), {
      lastRead: { [roomId]: userLastRead[roomId] }
    }, { merge: true }); // Merge ensures we only update the lastRead map and not overwrite profile data

    unreadCounts[roomId] = 0; // Clear immediately for snappy UI
    updateTotalUnread();

    // Reset styles for all tabs, then highlight active
    document.querySelectorAll('#roomsList > div').forEach(el => {
      el.classList.remove('bg-indigo-600/20', 'text-indigo-400', 'font-bold');
      const id = el.id.replace('tab-', '');
      updateRoomTabBadge(id);
    });

    const activeTab = document.getElementById(`tab-${roomId}`);
    if(activeTab) {
      activeTab.classList.remove('text-slate-100', 'text-slate-400', 'bg-slate-800');
      activeTab.classList.add('bg-indigo-600/20', 'text-indigo-400', 'font-bold');
      const badge = document.getElementById(`badge-${roomId}`);
      if(badge) badge.remove();
    }

    if (messageSub) messageSub();
    const box = document.getElementById('messageBox');
    box.innerHTML = '';
    window.loadedMessages = {};

    let isFirstLoadBatch = true;
    const q = query(collection(db, "rooms", roomId, "messages"), orderBy("time", "asc"));
    messageSub = onSnapshot(q, snap => {
      snap.docChanges().forEach(change => {
        const docId = change.doc.id;
        const m = change.doc.data();
        
        if (change.type === "added" || change.type === "modified") {
          window.loadedMessages[docId] = m;
          if (locallyHiddenMessages.has(docId)) return;
          renderOrUpdateMessage(docId, m);

          if (!document.getElementById('mediaSidebar').classList.contains('hidden')) { renderMediaSidebar(); }

          if (change.type === "added" && !isFirstLoadBatch && m.uid !== auth.currentUser.uid && !appSettings.muted) {
            if ("Notification" in window && Notification.permission === "granted") {
              const notification = new Notification(`Nexus Chat: ${roomName}`, {
                body: `${m.nickname}: ${m.text}`,
                icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png" 
              });
              setTimeout(() => notification.close(), 5000);
            }
          }
        }
        if (change.type === "removed") {
          delete window.loadedMessages[docId];
          const el = document.getElementById(`msg-${docId}`);
          if(el) el.remove();
        }
      });
      
      // Auto-Scroll to Separator OR Bottom
      if (isFirstLoadBatch) {
        const sep = document.getElementById('unread-separator');
        if (sep) {
          setTimeout(() => sep.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        } else {
          box.scrollTop = box.scrollHeight;
        }
        isFirstLoadBatch = false; 
      } else {
        box.scrollTop = box.scrollHeight;
      }
    });
  }

// --- AUTO-EXPANDING TEXTAREA LOGIC ---

  // --- RENDERING ---
function renderOrUpdateMessage(docId, m) {
    const box = document.getElementById('messageBox');
    const isMe = m.uid === auth.currentUser.uid;
    let timeString = m.time ? m.time.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

    let existingDiv = document.getElementById(`msg-${docId}`);
    let isNew = !existingDiv;

    // --- NEW SEPARATOR INJECTION ---
    if (isNew) {
      const mTime = m.time ? m.time.toMillis() : Date.now();
      
      // Inject Unread divider if it's the first message found past the entry time and it isn't ours
      if (!firstUnreadFound && mTime > currentRoomEntryTime && !isMe) {
        firstUnreadFound = true;
        const sep = document.createElement('div');
        sep.id = 'unread-separator';
        sep.className = 'w-full flex items-center my-6 z-10 px-4';
        sep.dataset.time = mTime - 1; // Ensure it sorts right before the unread message
        sep.innerHTML = `
          <div class="flex-1 border-t border-red-200 dark:border-red-900/50"></div>
          <span class="px-4 py-1 text-[11px] font-bold text-red-600 dark:text-red-400 uppercase tracking-widest bg-red-50 dark:bg-red-900/30 rounded-full mx-4 border border-red-100 dark:border-red-900/50 shadow-sm">New Messages</span>
          <div class="flex-1 border-t border-red-200 dark:border-red-900/50"></div>
        `;
        
        // Chronological insertion for separator
        const children = Array.from(box.children).filter(c => c.dataset && c.dataset.time);
        const nextNode = children.find(c => Number(c.dataset.time) > (mTime - 1));
        if (nextNode) {
          box.insertBefore(sep, nextNode);
        } else {
          box.appendChild(sep);
        }
      }

      existingDiv = document.createElement('div');
      existingDiv.id = `msg-${docId}`;
      existingDiv.dataset.time = mTime; // Store timestamp for sorting
      
      // Chronological insertion for the message instead of just appending
      const children = Array.from(box.children).filter(c => c.dataset && c.dataset.time);
      const nextNode = children.find(c => Number(c.dataset.time) > mTime);
      
      if (nextNode) {
        box.insertBefore(existingDiv, nextNode);
      } else {
        box.appendChild(existingDiv);
      }
    }
    
    existingDiv.className = `flex group w-full transition-all duration-200 relative ${isMe ? 'justify-end' : 'justify-start'}`;
    
    let replyHtml = '';
    if(m.replyTo) {
      replyHtml = `
        <div class="mb-1 bg-slate-100/50 rounded-lg p-2 border-l-4 border-indigo-400 text-xs text-slate-500 truncate max-w-[200px]">
          <span class="font-bold">${m.replyTo.nickname}</span>: ${m.replyTo.text}
        </div>`;
    }

    const dropdownMenu = `
      <div class="relative opacity-0 group-hover:opacity-100 transition-opacity flex items-center px-2">
        <button onclick="toggleMenu(event, '${docId}')" class="w-8 h-8 rounded-full hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div id="menu-${docId}" class="msg-dropdown hidden absolute top-8 ${isMe ? 'right-0' : 'left-0'} z-50 bg-white shadow-xl border border-slate-100 rounded-xl py-2 w-48 text-sm font-medium">
          <button onclick="replyMessage('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-reply w-5 text-slate-400"></i> Reply</button>
          <button onclick="copyText('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-regular fa-copy w-5 text-slate-400"></i> Copy Text</button>
          <button onclick="openForwardModal('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-share w-5 text-slate-400"></i> Forward</button>
          ${isMe ? `<button onclick="startEdit('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-pen w-5 text-slate-400"></i> Edit</button>` : ''}
          <div class="border-t border-slate-100 my-1"></div>
          <button onclick="deleteForMe('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-regular fa-eye-slash w-5 text-slate-400"></i> Delete for me</button>
          ${isMe ? `<button onclick="deleteForEveryone('${docId}')" class="w-full text-left px-4 py-2 hover:bg-red-50 text-red-600"><i class="fa-regular fa-trash-can w-5"></i> Delete for everyone</button>` : ''}
        </div>
      </div>
    `;

    let mediaHtml = '';
    if (m.fileUrl) {
      const isImage = !m.fileType || m.fileType.startsWith('image/');
      if (isImage) {
        mediaHtml = `<img src="${m.fileUrl}" class="max-w-[250px] mt-2 rounded-lg shadow-sm border cursor-pointer hover:opacity-90 transition-opacity ${isMe ? 'border-indigo-400' : 'border-slate-200'}" alt="Attached Media" loading="lazy" onclick="openImagePreview('${m.fileUrl}')">`;
      } else {
        mediaHtml = `
          <a href="${m.fileUrl}" target="_blank" class="flex items-center gap-3 mt-2 p-2.5 bg-black/5 rounded-lg border border-black/10 hover:bg-black/10 transition-colors no-underline">
            <i class="fa-solid fa-file-arrow-down text-xl ${isMe ? 'text-indigo-100' : 'text-indigo-500'}"></i>
            <span class="text-sm font-semibold truncate max-w-[150px] ${isMe ? 'text-white' : 'text-slate-700'}">${m.fileName || 'Download File'}</span>
          </a>`;
      }
    }

    let textHtml = '';
    if (m.text && m.text !== "Sent a GIF") {
      textHtml = `<p class="text-[14.5px] leading-relaxed whitespace-pre-wrap break-all ${m.fileUrl ? 'mb-2' : ''}">${m.text}</p>`;
    }

    existingDiv.innerHTML = `
      <div class="max-w-[75%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
        <div class="flex items-baseline gap-2 mb-1 px-1">
          ${!isMe ? `<span class="text-xs font-semibold text-slate-600 cursor-pointer hover:text-indigo-600 hover:underline transition-colors" onclick="viewPublicProfile('${m.uid}')">${m.nickname}</span>` : ''}
          <span class="text-[10px] font-medium text-slate-400">${timeString} ${m.isEdited ? '(edited)' : ''}</span>
        </div>

            ${isMe ? 'bg-gradient-to-br from-indigo-500 to-indigo-600 text-white rounded-2xl rounded-tr-sm' : 'bg-white text-slate-700 rounded-2xl rounded-tl-sm border border-slate-200/60'}">
            ${replyHtml}
            ${textHtml}
            ${mediaHtml}
          </div>
          ${dropdownMenu}
        </div>
      </div>`;
      
      window.replyMessage = window.startReply;
  }
  
  // --- SUBMIT MESSAGE ---
  document.getElementById('chatForm').onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    const currentActionType = actionState.type;
    const currentActionDocId = actionState.docId;

    cancelAction(); 

    try {
      if (currentActionType === 'edit') {
        await updateDoc(doc(db, "rooms", currentRoomId, "messages", currentActionDocId), { text: text, isEdited: true });
      } else {
        const payload = {
          uid: auth.currentUser.uid,
          nickname: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
          text: text, time: serverTimestamp()
        };
        if (currentActionType === 'reply') {
          const originalMsg = window.loadedMessages[currentActionDocId];
          payload.replyTo = {
            id: currentActionDocId, nickname: originalMsg.nickname,
            text: originalMsg.text.substring(0, 50) + (originalMsg.text.length > 50 ? '...' : '')
          };
        }
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), payload);
      }
      setTimeout(() => document.getElementById('messageBox').scrollTop = document.getElementById('messageBox').scrollHeight, 100);
    } catch(err) {
      input.value = text; alert("Action failed: " + err.message);
    }
  };

// --- FILE UPLOAD LOGIC (Cloudinary) ---
  const CLOUDINARY_CLOUD_NAME = 'djugbnsi4'; 
  const CLOUDINARY_UPLOAD_PRESET = 'webchatapp'; 

  document.getElementById('fileUploadInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const attachBtnIcon = document.getElementById('attachBtnIcon');
    attachBtnIcon.className = "fa-solid fa-circle-notch fa-spin text-indigo-500";
    const formData = new FormData();
    formData.append('file', file); formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.secure_url) {
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
          uid: auth.currentUser.uid,
          nickname: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
          text: `Sent a file: ${file.name}`, fileUrl: data.secure_url,
          fileType: file.type || data.resource_type, fileName: file.name, time: serverTimestamp()
        });
        const box = document.getElementById('messageBox');
        setTimeout(() => box.scrollTop = box.scrollHeight, 100);
      } else throw new Error(data.error?.message || "Upload failed");
    } catch (err) { alert("Error uploading file: " + err.message); } 
    finally { attachBtnIcon.className = "fa-solid fa-paperclip text-lg"; e.target.value = ''; }
  });

async function searchGiphy(term) {
  const endpoint = term === 'trending' ? `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_API_KEY}&limit=10&rating=g` : `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(term)}&limit=10&rating=g`;
  try {
    const res = await fetch(endpoint);
    const { data } = await res.json();
    document.getElementById('giphyResults').innerHTML = data.map(gif => `<img src="${gif.images.fixed_height_small.url}" class="w-full h-24 object-cover cursor-pointer hover:opacity-80 rounded-md" onclick="sendGiphy('${gif.images.fixed_height.url}')">`).join('');
  } catch (err) { console.error("Giphy error:", err); }
}

// --- AUTO-HIDE UNREAD SEPARATOR WHEN SCROLLED TO BOTTOM ---
const msgBox = document.getElementById('messageBox');

msgBox.addEventListener('scroll', function() {
  // Check if the scroll position + the visible height equals the total scrollable height.
  // We use a 10px threshold to ensure it triggers smoothly even with fractional pixel rendering.
  const isAtBottom = this.scrollTop + this.clientHeight >= this.scrollHeight - 10;
  
  if (isAtBottom) { 
    const separator = document.getElementById('unread-separator');
    
    if (separator) {
      // Smoothly fade it out before removing it from the DOM
      separator.style.transition = 'opacity 0.3s ease, height 0.3s ease, margin 0.3s ease';
      separator.style.opacity = '0';
      separator.style.height = '0px';
      separator.style.marginTop = '0px';
      separator.style.marginBottom = '0px';
      separator.style.overflow = 'hidden';
      
      // Remove it completely after the fade animation finishes
      setTimeout(() => {
        if (separator.parentNode) {
          separator.remove();
        }
      }, 300);
    }
  }
});

// --- MEDIA POPUP & PREVIEW LOGIC ---

  window.toggleMediaDropdown = (e) => {
    if(e) e.stopPropagation();
    const dropdown = document.getElementById('mediaDropdown');
    dropdown.classList.toggle('hidden');
    if (!dropdown.classList.contains('hidden')) {
      renderMediaDropdown();
    }
  };

  // Close dropdown if user clicks outside of it
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('mediaDropdown');
    const toggleBtn = document.getElementById('toggleMediaBtn');
    if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
      dropdown.classList.add('hidden');
    }
  });

  window.renderMediaDropdown = () => {
    const container = document.getElementById('mediaDropdownList');
    if (!container) return;
    container.innerHTML = '';
    
    // Sort messages newest first
    const messages = Object.values(window.loadedMessages).sort((a, b) => {
       const tA = a.time ? a.time.toMillis() : 0;
       const tB = b.time ? b.time.toMillis() : 0;
       return tB - tA; 
    });

    const fileMessages = messages.filter(m => m.fileUrl);

    if (fileMessages.length === 0) {
      container.innerHTML = `
        <div class="col-span-3 text-center py-10 flex flex-col items-center">
          <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-3">
            <i class="fa-solid fa-folder-open text-2xl text-slate-400"></i>
          </div>
          <p class="text-sm font-semibold text-slate-500">No media yet</p>
          <p class="text-xs text-slate-400 mt-1">Files shared here will appear in this gallery.</p>
        </div>`;
      return;
    }

    fileMessages.forEach(m => {
      const isImage = !m.fileType || m.fileType.startsWith('image/');
      const el = document.createElement('div');
      
      if (isImage) {
        el.className = 'aspect-square rounded-xl overflow-hidden border border-slate-200 shadow-sm cursor-pointer hover:shadow-lg hover:border-indigo-400 hover:-translate-y-1 transition-all relative group';
        el.innerHTML = `
          <img src="${m.fileUrl}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-2 text-white">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
          </div>
        `;
        el.onclick = () => window.openImagePreview(m.fileUrl);
      } else {
        el.className = 'aspect-square rounded-xl overflow-hidden border border-slate-200 shadow-sm cursor-pointer hover:shadow-lg hover:border-indigo-400 hover:-translate-y-1 transition-all relative group bg-slate-50 flex flex-col items-center justify-center text-center p-2';
        el.innerHTML = `
          <i class="fa-solid fa-file-lines text-3xl text-indigo-400 mb-2"></i>
          <p class="text-[10px] font-semibold text-slate-600 w-full truncate px-1">${m.fileName || 'Document'}</p>
        `;
        el.onclick = () => window.open(m.fileUrl, '_blank');
      }
      container.appendChild(el);
    });
  };

  window.openImagePreview = (url) => {
    const img = document.getElementById('previewImage');
    img.src = url;
    document.getElementById('imagePreviewModal').classList.remove('hidden');
    setTimeout(() => img.classList.replace('scale-95', 'scale-100'), 10);
  };

  window.closeImagePreview = () => {
    const img = document.getElementById('previewImage');
    img.classList.replace('scale-100', 'scale-95');
    setTimeout(() => {
      document.getElementById('imagePreviewModal').classList.add('hidden');
      img.src = '';
    }, 200); 
  };
   
</script>
