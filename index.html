<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Chat | Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .message-container { height: calc(100vh - 144px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .chat-bg {
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden" onclick="closeAllMenus()">

<div id="authOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
  <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md transform transition-all">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-bolt text-white text-3xl"></i>
      </div>
      <h2 id="authTitle" class="text-3xl font-bold text-slate-800 tracking-tight">Welcome Back</h2>
    </div>
    <form id="authForm" class="space-y-5">
      <div id="displayNameField" class="hidden">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Display Name</label>
        <input type="text" id="authName" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address</label>
        <input type="email" id="authEmail" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
        <input type="password" id="authPassword" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <button type="submit" id="authSubmitBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-xl font-bold text-lg shadow-md hover:shadow-lg transition-all">Login</button>
    </form>
    <div class="mt-8 text-center">
      <button id="toggleAuthMode" class="text-indigo-600 text-sm font-semibold hover:text-purple-600">Don't have an account? Create one</button>
    </div>
  </div>
</div>

<div id="forwardModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60] hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden" onclick="event.stopPropagation()">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="font-bold text-slate-800">Forward Message</h3>
      <button onclick="closeForwardModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="forwardRoomsList" class="p-2 max-h-64 overflow-y-auto"></div>
  </div>
</div>

<div id="createRoomModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[60] hidden">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden p-8" onclick="event.stopPropagation()">
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-xl text-slate-800">Create New Channel</h3>
      <button onclick="closeCreateRoomModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <form id="createRoomForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Channel Name</label>
        <input type="text" id="newRoomName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. project-apollo">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Privacy</label>
        <select id="newRoomType" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="public">Public (Anyone can join)</option>
          <option value="private">Private (Invite only)</option>
        </select>
      </div>
      
      <div id="inviteMembersSection" class="hidden border-t border-slate-100 pt-4 mt-4">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Invite via Email</label>
        <div class="flex gap-2">
          <input type="email" id="inviteEmailInput" class="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="colleague@example.com">
          <button type="button" onclick="addEmailToInvite()" class="bg-slate-800 text-white px-4 rounded-xl hover:bg-slate-700 transition">Add</button>
        </div>
        <div id="invitedEmailsList" class="flex flex-wrap gap-2 mt-3"></div>
      </div>

      <button type="submit" id="createRoomSubmitBtn" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold mt-4 hover:bg-indigo-700 transition-all">Create Channel</button>
    </form>
  </div>
</div>

<div id="app" class="flex h-screen hidden">
  <aside class="w-80 bg-[#111827] text-white flex flex-col border-r border-slate-800 shadow-xl z-20">
    <div class="h-16 px-6 border-b border-slate-800 flex justify-between items-center bg-[#1f2937]">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md">
          <i class="fa-solid fa-bolt text-sm"></i>
        </div>
        <h1 class="text-lg font-bold tracking-wide">Nexus</h1>
      </div>
      <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-slate-700">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
    
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="flex justify-between items-center mb-4 px-2">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Channels</p>
        <button onclick="openCreateRoomModal()" class="text-slate-400 hover:text-white transition-colors p-1" title="Create Channel">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div id="roomsList"></div>
    </div>

    <div class="p-5 bg-[#0b0f19] border-t border-slate-800 flex items-center gap-4">
      <div class="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center font-bold text-lg shadow-inner ring-2 ring-slate-800" id="userInitial">?</div>
      <div class="flex-1 min-w-0">
        <p id="userName" class="text-sm font-bold truncate text-slate-200"></p>
        <p class="text-[11px] font-medium text-emerald-400 uppercase">Online</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col relative bg-white">
    <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 shadow-sm z-10 absolute top-0 w-full">
      <div class="flex items-center gap-3">
        <i id="roomTypeIcon" class="fa-solid fa-hashtag text-slate-400 text-lg"></i>
        <h2 id="currentRoomName" class="font-bold text-xl text-slate-800">Select a Room</h2>
      </div>
      <button id="deleteRoomBtn" onclick="deleteCurrentRoom()" class="hidden text-slate-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50" title="Delete Channel">
        <i class="fa-solid fa-trash-can text-lg"></i>
      </button>
    </header>

    <div id="messageBox" class="message-container chat-bg overflow-y-auto p-8 flex flex-col gap-6 mt-16 scroll-smooth"></div>

    <div class="bg-white border-t border-slate-200 flex flex-col">
      <div id="actionBanner" class="hidden px-6 py-2 bg-indigo-50 flex justify-between items-center border-b border-indigo-100">
        <div class="flex items-center gap-2 text-sm text-indigo-700 truncate">
          <i id="actionIcon" class="fa-solid fa-reply"></i>
          <span id="actionText" class="font-medium truncate"></span>
        </div>
        <button onclick="cancelAction()" class="text-indigo-400 hover:text-indigo-700 p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="chatForm" class="flex items-center gap-3 p-5 max-w-5xl mx-auto w-full relative">
  <button type="button" onclick="toggleGiphyPanel()" class="text-slate-400 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-slate-100 flex items-center justify-center">
    <i class="fa-solid fa-face-smile text-lg"></i>
  </button>
  
  <textarea id="messageInput" rows="1" placeholder="Message this channel..." class="flex-1 bg-slate-100 border border-slate-200 rounded-3xl pl-6 pr-14 py-3 focus:bg-white focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all shadow-inner font-medium resize-none overflow-hidden min-h-[48px] max-h-32 leading-relaxed mt-1 mb-1"></textarea>
  
  <button type="submit" class="absolute right-7 top-6.5 bottom-6.5 aspect-square bg-indigo-600 text-white rounded-full flex items-center justify-center w-10 h-10 hover:bg-indigo-700 shadow-md transition-all">
    <i class="fa-solid fa-paper-plane text-sm ml-0.5"></i>
  </button>

  <div id="giphyPanel" class="hidden absolute bottom-20 left-0 w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-50">
    <div class="p-3 border-b border-slate-100 bg-slate-50">
      <input type="text" id="giphySearchInput" placeholder="Search GIPHY..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div id="giphyResults" class="grid grid-cols-2 gap-1 p-1 max-h-60 overflow-y-auto"></div>
  </div>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, deleteDoc, updateDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyDmQiNQx2oTSydrFLgGhORXsxBjRAnghr4",
    authDomain: "chatting-f6656.firebaseapp.com",
    projectId: "chatting-f6656"
  });
  
  const db = getFirestore(app);
  const auth = getAuth(app);

  let isSignUpMode = false;
  let currentRoomId = "general";
  let messageSub = null;
  let availableRooms = [];
  
  // App State
  const locallyHiddenMessages = new Set();
  window.loadedMessages = {}; 
  let actionState = { type: null, docId: null }; 
  
  // Room Creation State
  let pendingInvites = new Set();

  // --- UI TOGGLES (Auth) ---
  const toggleBtn = document.getElementById('toggleAuthMode');
  toggleBtn.onclick = () => {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').textContent = isSignUpMode ? "Create Account" : "Welcome Back";
    document.getElementById('authSubmitBtn').textContent = isSignUpMode ? "Create Account" : "Login";
    document.getElementById('displayNameField').classList.toggle('hidden', !isSignUpMode);
    toggleBtn.textContent = isSignUpMode ? "Already have an account? Log in" : "Don't have an account? Create one";
  };

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const name = document.getElementById('authName').value;
    try {
      if (isSignUpMode) {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCred.user, { displayName: name });
        await setDoc(doc(db, "users", userCred.user.uid), { nickname: name, email: email, createdAt: serverTimestamp() });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) { alert(err.message); }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, u => {
    if (u) {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('userName').textContent = u.displayName || u.email.split('@')[0];
      document.getElementById('userInitial').textContent = (u.displayName || u.email).charAt(0).toUpperCase();
      
      // 🔥 NEW: Ask for Chrome Notification Permission
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }

      loadRooms();
      switchRoom('general', 'general', 'public');
    } else {
      document.getElementById('authOverlay').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }
  });

  // --- CREATE ROOM LOGIC ---
  window.openCreateRoomModal = () => {
    document.getElementById('createRoomModal').classList.remove('hidden');
    document.getElementById('createRoomForm').reset();
    document.getElementById('inviteMembersSection').classList.add('hidden');
    pendingInvites.clear();
    renderInvitedEmails();
  };

  window.closeCreateRoomModal = () => document.getElementById('createRoomModal').classList.add('hidden');

  document.getElementById('newRoomType').addEventListener('change', (e) => {
    const inviteSection = document.getElementById('inviteMembersSection');
    if (e.target.value === 'private') {
      inviteSection.classList.remove('hidden');
    } else {
      inviteSection.classList.add('hidden');
    }
  });

  window.addEmailToInvite = () => {
    const input = document.getElementById('inviteEmailInput');
    const email = input.value.trim().toLowerCase();
    if (email && email !== auth.currentUser.email) {
      pendingInvites.add(email);
      input.value = '';
      renderInvitedEmails();
    }
  };

  window.removeInvite = (email) => {
    pendingInvites.delete(email);
    renderInvitedEmails();
  };

  function renderInvitedEmails() {
    const container = document.getElementById('invitedEmailsList');
    container.innerHTML = '';
    pendingInvites.forEach(email => {
      container.innerHTML += `
        <span class="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-full flex items-center gap-1">
          ${email} <button type="button" onclick="removeInvite('${email}')" class="text-indigo-500 hover:text-indigo-900"><i class="fa-solid fa-xmark"></i></button>
        </span>
      `;
    });
  }

  document.getElementById('createRoomForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('createRoomSubmitBtn');
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';
    btn.disabled = true;

    try {
      const name = document.getElementById('newRoomName').value.trim();
      const type = document.getElementById('newRoomType').value;
      let members = [];

      // If private, resolve emails to UIDs
      if (type === 'private') {
        
        // 🔥 FIX 2: Automatically add any email they typed but forgot to click "Add" for
        const leftoverEmail = document.getElementById('inviteEmailInput').value.trim().toLowerCase();
        if (leftoverEmail && leftoverEmail !== auth.currentUser.email) {
          pendingInvites.add(leftoverEmail);
        }

        // 🔥 FIX 3: Prevent creating a private room with no one else in it
        if (pendingInvites.size === 0) {
          alert("You must invite at least one person to create a private channel.");
          btn.innerHTML = 'Create Channel';
          btn.disabled = false;
          return;
        }

        members.push(auth.currentUser.uid); // Creator is always a member
        
        for (let email of pendingInvites) {
          const q = query(collection(db, "users"), where("email", "==", email));
          const snap = await getDocs(q);
          
          if (!snap.empty) {
            members.push(snap.docs[0].id);
          } else {
            alert(`Could not find user: ${email}. They must create an account first.`);
            btn.innerHTML = 'Create Channel';
            btn.disabled = false;
            return; // Stop creation entirely if a user isn't found
          }
        }
      }

      await addDoc(collection(db, "rooms"), {
        name: name,
        type: type,
        members: members,
        createdBy: auth.currentUser.uid,
        createdAt: serverTimestamp()
      });

      closeCreateRoomModal();
    } catch(err) {
      alert("Error creating room: " + err.message);
    } finally {
      btn.innerHTML = 'Create Channel';
      btn.disabled = false;
    }
  };

  // --- ROOMS ---
  function loadRooms() {
    onSnapshot(collection(db, "rooms"), snap => {
      const container = document.getElementById('roomsList');
      container.innerHTML = '';
      availableRooms = [];
      
      // ALWAYS render the General room at the top
      availableRooms.push({id: 'general', name: 'General Chat'});
      renderRoomTab('general', 'General Chat', 'public', null);

      snap.forEach(room => {
        const data = room.data();
        if (room.id === 'general') return;
        
        // PRIVACY FILTER
        if (data.type === 'public' || (data.members && data.members.includes(auth.currentUser.uid))) {
          availableRooms.push({id: room.id, name: data.name || room.id});
          // Pass 'createdBy' to the render function
          renderRoomTab(room.id, data.name || room.id, data.type || 'public', data.createdBy);
        }
      });
      
      const activeTab = document.getElementById(`tab-${currentRoomId}`);
      if(activeTab) activeTab.classList.add('bg-indigo-600/20', 'text-indigo-400');
    });
  }

  function renderRoomTab(id, name, type, createdBy) {
    if(document.getElementById(`tab-${id}`)) return;
    const div = document.createElement('div');
    div.id = `tab-${id}`;
    
    const icon = type === 'private' ? 'fa-lock text-[11px]' : 'fa-hashtag';
    
    div.className = `flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer transition-all duration-200 mb-1 group font-medium text-sm hover:bg-[#1f2937] text-slate-400 hover:text-slate-200`;
    div.innerHTML = `<i class="fa-solid ${icon} opacity-70 group-hover:text-slate-200 w-4 text-center"></i> <span class="truncate">${name}</span>`;
    
    // Pass 'createdBy' to switchRoom
    div.onclick = () => switchRoom(id, name, type, createdBy);
    document.getElementById('roomsList').appendChild(div);
  }

  function switchRoom(roomId, roomName, type, createdBy) {
    currentRoomId = roomId;
    document.getElementById('currentRoomName').textContent = roomName;
    document.getElementById('roomTypeIcon').className = `fa-solid ${type === 'private' ? 'fa-lock' : 'fa-hashtag'} text-slate-400 text-lg`;
    
    // 🔥 SHOW/HIDE DELETE BUTTON
    const deleteBtn = document.getElementById('deleteRoomBtn');
    if (roomId !== 'general' && createdBy === auth.currentUser.uid) {
      deleteBtn.classList.remove('hidden');
    } else {
      deleteBtn.classList.add('hidden'); // Hide if it's the general room or user is not the creator
    }
    
    window.cancelAction(); 
    
    document.querySelectorAll('#roomsList > div').forEach(el => el.classList.remove('bg-indigo-600/20', 'text-indigo-400'));
    const activeTab = document.getElementById(`tab-${roomId}`);
    if(activeTab) activeTab.classList.add('bg-indigo-600/20', 'text-indigo-400');

    if (messageSub) messageSub();
    const box = document.getElementById('messageBox');
    box.innerHTML = '';
    window.loadedMessages = {};

    let isFirstLoad = true; // 🔥 Track the first load
    
    const q = query(collection(db, "rooms", roomId, "messages"), orderBy("time", "asc"));
    messageSub = onSnapshot(q, snap => {
      snap.docChanges().forEach(change => {
        const docId = change.doc.id;
        const m = change.doc.data();
        
        if (change.type === "added" || change.type === "modified") {
          window.loadedMessages[docId] = m;
          if (locallyHiddenMessages.has(docId)) return;
          renderOrUpdateMessage(docId, m);

          // 🔥 NEW: Send Notification
          // Only notify if it's a newly ADDED message, not the first load, and not sent by you
          if (change.type === "added" && !isFirstLoad && m.uid !== auth.currentUser.uid) {
            if ("Notification" in window && Notification.permission === "granted") {
              // Create the system notification
              const notification = new Notification(`Nexus Chat: ${roomName}`, {
                body: `${m.nickname}: ${m.text}`,
                icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png" // Generic chat icon
              });
              
              // Optional: Auto-close the notification after 5 seconds
              setTimeout(() => notification.close(), 5000);
            }
          }

        }
        if (change.type === "removed") {
          delete window.loadedMessages[docId];
          const el = document.getElementById(`msg-${docId}`);
          if(el) el.remove();
        }
      });
      
      isFirstLoad = false; // 🔥 Mark first load as complete
      box.scrollTop = box.scrollHeight;
    });
  }

  // 🔥 NEW: Delete Room Function
  window.deleteCurrentRoom = async () => {
    if (confirm("Are you sure you want to delete this channel? This action cannot be undone and will remove it for everyone.")) {
      try {
        await deleteDoc(doc(db, "rooms", currentRoomId));
        // Instantly switch back to general chat
        switchRoom('general', 'General Chat', 'public', null);
      } catch (err) {
        alert("Failed to delete room: " + err.message);
      }
    }
  };

  // --- MESSAGE ACTIONS (GLOBAL EXPORTS) ---
  window.toggleMenu = (e, id) => {
    e.stopPropagation();
    closeAllMenus();
    document.getElementById(`menu-${id}`).classList.toggle('hidden');
  };

  window.closeAllMenus = () => {
    document.querySelectorAll('.msg-dropdown').forEach(m => m.classList.add('hidden'));
  };

  window.copyText = async (id) => {
    await navigator.clipboard.writeText(window.loadedMessages[id].text);
  };

  window.deleteForMe = (id) => {
    locallyHiddenMessages.add(id);
    document.getElementById(`msg-${id}`).remove();
  };

  window.deleteForEveryone = async (id) => {
    if(confirm("Permanently delete this message for everyone?")) {
      await deleteDoc(doc(db, "rooms", currentRoomId, "messages", id));
    }
  };

  window.startEdit = (id) => {
    actionState = { type: 'edit', docId: id };
    document.getElementById('messageInput').value = window.loadedMessages[id].text;
    document.getElementById('messageInput').focus();
    
    document.getElementById('actionBanner').classList.remove('hidden');
    document.getElementById('actionIcon').className = "fa-solid fa-pen";
    document.getElementById('actionText').textContent = "Editing message";
  };

  window.startReply = (id) => {
    actionState = { type: 'reply', docId: id };
    const m = window.loadedMessages[id];
    document.getElementById('messageInput').focus();
    
    document.getElementById('actionBanner').classList.remove('hidden');
    document.getElementById('actionIcon').className = "fa-solid fa-reply";
    document.getElementById('actionText').textContent = `Replying to ${m.nickname}: ${m.text}`;
  };

  window.cancelAction = () => {
    actionState = { type: null, docId: null };
    document.getElementById('actionBanner').classList.add('hidden');
    
    const input = document.getElementById('messageInput');
    input.value = '';
    input.style.height = 'auto'; // 🔥 NEW: Shrink it back down!
  };
    
  // --- FORWARDING ---
  window.openForwardModal = (id) => {
    const text = window.loadedMessages[id].text;
    const modal = document.getElementById('forwardModal');
    const list = document.getElementById('forwardRoomsList');
    list.innerHTML = '';
    
    availableRooms.forEach(room => {
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-4 py-3 hover:bg-slate-100 rounded-lg font-medium text-slate-700 flex justify-between items-center group mb-1 transition-all";
      btn.innerHTML = `<span><i class="fa-solid fa-hashtag text-slate-400 mr-2"></i> ${room.name}</span> <i class="fa-solid fa-paper-plane text-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>`;
      btn.onclick = async () => {
        try {
          await addDoc(collection(db, "rooms", room.id, "messages"), {
            uid: auth.currentUser.uid,
            nickname: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
            text: `[Forwarded]: ${text}`,
            time: serverTimestamp()
          });
          closeForwardModal();
          alert(`Forwarded to ${room.name}`);
        } catch(e) { alert("Error forwarding message."); }
      };
      list.appendChild(btn);
    });
    modal.classList.remove('hidden');
  };

  window.closeForwardModal = () => document.getElementById('forwardModal').classList.add('hidden');

// --- AUTO-EXPANDING TEXTAREA LOGIC ---
  const messageInput = document.getElementById('messageInput');

  messageInput.addEventListener('input', function() {
    // 1. Reset height to auto to recalculate shrinking
    this.style.height = 'auto';
    // 2. Set the height to match the new scrollHeight
    this.style.height = this.scrollHeight + 'px';
  });

  messageInput.addEventListener('keydown', function(e) {
    // 3. If pressing Enter WITHOUT holding Shift, send the message
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault(); // Stop it from dropping to a new line
      document.querySelector('#chatForm button[type="submit"]').click(); // Trigger form submission
    }
  });
    
  // --- RENDERING ---
function renderOrUpdateMessage(docId, m) {
    const box = document.getElementById('messageBox');
    const isMe = m.uid === auth.currentUser.uid;
    let timeString = m.time ? m.time.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

    let existingDiv = document.getElementById(`msg-${docId}`);
    if(!existingDiv) {
      existingDiv = document.createElement('div');
      existingDiv.id = `msg-${docId}`;
      box.appendChild(existingDiv);
    }
    
    existingDiv.className = `flex group w-full transition-all duration-200 relative ${isMe ? 'justify-end' : 'justify-start'}`;
    
    let replyHtml = '';
    if(m.replyTo) {
      replyHtml = `
        <div class="mb-1 bg-slate-100/50 rounded-lg p-2 border-l-4 border-indigo-400 text-xs text-slate-500 truncate max-w-[200px]">
          <span class="font-bold">${m.replyTo.nickname}</span>: ${m.replyTo.text}
        </div>`;
    }

    const dropdownMenu = `
      <div class="relative opacity-0 group-hover:opacity-100 transition-opacity flex items-center px-2">
        <button onclick="toggleMenu(event, '${docId}')" class="w-8 h-8 rounded-full hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>
        <div id="menu-${docId}" class="msg-dropdown hidden absolute top-8 ${isMe ? 'right-0' : 'left-0'} z-50 bg-white shadow-xl border border-slate-100 rounded-xl py-2 w-48 text-sm font-medium">
          <button onclick="replyMessage('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-reply w-5 text-slate-400"></i> Reply</button>
          <button onclick="copyText('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-regular fa-copy w-5 text-slate-400"></i> Copy Text</button>
          <button onclick="openForwardModal('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-share w-5 text-slate-400"></i> Forward</button>
          ${isMe ? `<button onclick="startEdit('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-solid fa-pen w-5 text-slate-400"></i> Edit</button>` : ''}
          <div class="border-t border-slate-100 my-1"></div>
          <button onclick="deleteForMe('${docId}')" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700"><i class="fa-regular fa-eye-slash w-5 text-slate-400"></i> Delete for me</button>
          ${isMe ? `<button onclick="deleteForEveryone('${docId}')" class="w-full text-left px-4 py-2 hover:bg-red-50 text-red-600"><i class="fa-regular fa-trash-can w-5"></i> Delete for everyone</button>` : ''}
        </div>
      </div>
    `;

    // 🔥 NEW: Check if there is a fileUrl (like a GIPHY link) and create an image tag
    let mediaHtml = '';
    if (m.fileUrl) {
      mediaHtml = `<img src="${m.fileUrl}" class="max-w-[250px] rounded-lg shadow-sm border ${isMe ? 'border-indigo-400' : 'border-slate-200'}" alt="GIF" loading="lazy">`;
    }

    // 🔥 FIXED: Added 'break-words' to the class list to prevent layout stretching
    // 🔥 FIXED AGAIN: Changed 'break-words' to 'break-all' for aggressive chopping
    let textHtml = '';
    if (m.text && m.text !== "Sent a GIF") {
      textHtml = `<p class="text-[14.5px] leading-relaxed whitespace-pre-wrap break-all ${m.fileUrl ? 'mb-2' : ''}">${m.text}</p>`;
    }

    existingDiv.innerHTML = `
      <div class="max-w-[75%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
        <div class="flex items-baseline gap-2 mb-1 px-1">
          ${!isMe ? `<span class="text-xs font-semibold text-slate-600">${m.nickname}</span>` : ''}
          <span class="text-[10px] font-medium text-slate-400">${timeString} ${m.isEdited ? '(edited)' : ''}</span>
        </div>
        <div class="flex items-center ${isMe ? 'flex-row-reverse' : 'flex-row'}">
          <div class="px-4 py-2.5 shadow-sm relative group-hover:shadow-md transition-shadow 
            ${isMe ? 'bg-gradient-to-br from-indigo-500 to-indigo-600 text-white rounded-2xl rounded-tr-sm' : 'bg-white text-slate-700 rounded-2xl rounded-tl-sm border border-slate-200/60'}">
            ${replyHtml}
            ${textHtml}
            ${mediaHtml}
          </div>
          ${dropdownMenu}
        </div>
      </div>`;
      
      window.replyMessage = window.startReply;
  }
  // --- SUBMIT MESSAGE ---
  document.getElementById('chatForm').onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    try {
      if (actionState.type === 'edit') {
        await updateDoc(doc(db, "rooms", currentRoomId, "messages", actionState.docId), {
          text: text,
          isEdited: true
        });
      } else {
        const payload = {
          uid: auth.currentUser.uid,
          nickname: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
          text: text,
          time: serverTimestamp()
        };
        
        if (actionState.type === 'reply') {
          const originalMsg = window.loadedMessages[actionState.docId];
          payload.replyTo = {
            id: actionState.docId,
            nickname: originalMsg.nickname,
            text: originalMsg.text.substring(0, 50) + (originalMsg.text.length > 50 ? '...' : '')
          };
        }
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), payload);
      }
      
      cancelAction();
      setTimeout(() => document.getElementById('messageBox').scrollTop = document.getElementById('messageBox').scrollHeight, 100);
    } catch(err) {
      alert("Action failed: " + err.message);
    }
  };

 // --- GIPHY LOGIC ---
const GIPHY_API_KEY = 'TbcofJ30evYoPwTW8w2WCS4gBZD01hVh';

window.toggleGiphyPanel = () => {
  const panel = document.getElementById('giphyPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    document.getElementById('giphySearchInput').focus();
    searchGiphy('trending'); // Show trending by default
  }
};

// Search GIPHY as you type
document.getElementById('giphySearchInput').addEventListener('input', (e) => {
  const term = e.target.value.trim();
  searchGiphy(term || 'trending');
});

async function searchGiphy(term) {
  const endpoint = term === 'trending' 
    ? `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_API_KEY}&limit=10&rating=g`
    : `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(term)}&limit=10&rating=g`;
  
  try {
    const res = await fetch(endpoint);
    const { data } = await res.json();
    const resultsContainer = document.getElementById('giphyResults');
    resultsContainer.innerHTML = data.map(gif => `
      <img src="${gif.images.fixed_height_small.url}" 
           class="w-full h-24 object-cover cursor-pointer hover:opacity-80 rounded-md" 
           onclick="sendGiphy('${gif.images.fixed_height.url}')">
    `).join('');
  } catch (err) { console.error("Giphy error:", err); }
}

window.sendGiphy = async (url) => {
  try {
    await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
      uid: auth.currentUser.uid,
      nickname: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
      text: "Sent a GIF",
      fileUrl: url, // We reuse your existing media rendering logic!
      fileType: "image/gif",
      time: serverTimestamp()
    });
    document.getElementById('giphyPanel').classList.add('hidden');
  } catch (err) { alert(err.message); }
};
